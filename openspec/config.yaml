schema: spec-driven

context: |
  项目：MediaLens。将公开社交分享文本解析为结构化媒体资源，供调用方自行下载和保存。
  当前阶段：仓库初始化。已有中英文 README、MIT 许可、.NET 通用配置和空解决方案；尚无可运行的解析服务。

  技术与部署：
  - 使用 C#、.NET 10，目标框架为 net10.0，API 宿主规划为 ASP.NET Core 10。
  - 以 Docker Linux 容器作为推荐部署方式；运行项目、Dockerfile 和 Compose 配置尚待实现。
  - 遵循现有 global.json、Directory.Build.props 和 .editorconfig。

  功能边界：
  - 输入为公开分享文本；提取 URL、展开短链、识别平台和作品 ID，再获取作品信息。
  - 返回媒体类型、完整的最终 CDN URL、必要下载请求头，以及可确认的过期信息。
  - 区分视频与图集；图集允许混合普通图片和实况照片，并保留顺序及每张实况的图片/短片配对关系。
  - 不确定过期时间时返回空值；保留 URL 查询参数。调用方负责实际下载、本地存储、相册操作和原生实况封装。
  - 服务端不承担媒体文件落盘、转码、批量采集或相册集成。

  严格无 Cookie：
  - 不接收、生成、存储或发送 Cookie；不转发入站 Cookie，也不复用上游 Set-Cookie。
  - 短链及播放地址的每一跳重定向同样遵守无 Cookie 约束。
  - 不构造账号/游客身份、不维护身份池、不使用浏览器会话回退。
  - 常规 HTTP 请求头和本地签名计算只有在不依赖身份或会话构造时才可采用。
  - 匿名链路无法返回媒体数据时明确失败，不隐式降级为 Cookie 方案。

  平台与验证：
  - 首个验证对象是抖音公开分享。其他平台需要分别评估，当前不宣称已经支持。
  - 公开内容可见性不等于详情接口允许匿名访问；严格无 Cookie 的可行性尚未验证。
  - 验证需覆盖视频、普通图集、实况图集、混合图集以及调用方网络中的最终 CDN 下载。

  开发约定：
  - OpenSpec 的说明、设计、任务和验收内容优先使用中文，保留工具规定的标题与关键字。
  - C# 使用文件范围命名空间；接口与实现默认位于同一命名空间，不为组织代码引入不必要分层。
  - 公开 API 保持精简，明确可空性和异步边界；优先采用 native AOT 友好的实现。
  - 复杂或非显而易见的协议处理需要说明意图；协议常量使用语义明确的命名。

rules:
  proposal:
    - 使用中文正文，保留模板要求的 Markdown 标题。
    - 明确变更范围、非目标和验证依据，不将待验证的无 Cookie 路线描述为已实现能力。
  specs:
    - 要求及场景正文使用中文，保留 Requirement、Scenario、SHALL/MUST 和 WHEN/THEN 等工具要求的格式与关键字。
    - 涉及网络请求或重定向时，明确每一跳不携带 Cookie、不得构造身份，以及匿名访问失败时的行为。
    - 涉及媒体结果时，覆盖图集顺序、混合图集、实况配对、最终 CDN 地址及必要下载请求头。
  design:
    - 说明 .NET 10 实现方式及相关部署影响，优先保持设计精简。
    - 区分本地签名计算与身份/会话构造；涉及签名或编码时说明字节一致性和固定输入的验证方法。
    - 需要平台实测时，区分已有证据与假设，并说明如何验证服务端解析和调用方下载的完整链路。
  tasks:
    - 使用中文，按依赖顺序列出可独立验证的任务。
    - 根据变更安排适当验证，保留可复现的结果；仅在实际项目和容器文件存在后列出相应构建或部署命令。
