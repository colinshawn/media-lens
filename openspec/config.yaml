schema: spec-driven

context: |
  项目：MediaLens。将公开社交分享文本解析为结构化媒体资源，供调用方自行下载和保存。
  当前阶段：已交付抖音四类媒体及 Bilibili 普通 UGC 完整 MP4 的严格无 Cookie 分享解析。已有 Minimal API、共享解析库、验证工具、测试、Linux 容器和中英文使用文档。

  技术与部署：
  - 使用 C#、.NET 10，目标框架为 net10.0，API 宿主采用 ASP.NET Core 10 Minimal API。
  - 以 Docker Linux 容器作为推荐部署方式；已提供运行项目、多阶段 Dockerfile 和环境配置说明。
  - 遵循现有 global.json、Directory.Build.props 和 .editorconfig。

  HTTP 接口路径：
  - POST /api/v1/resolve 根据分享文本自动识别平台；保持此入口供后续平台复用。
  - POST /api/v1/platforms/{platform}/resolve 指定平台，当前为 douyin 与 bilibili；请求体仍仅包含 text，链接与平台不一致时明确失败。
  - GET /api/v1/platforms 返回内存注册表中的平台、启用状态和逐类型能力，不查询上游或依赖数据库。
  - 平台以稳定小写字符串标识，通过适配器注册扩展；新增平台不改变 v1 路径，媒体类型不拆成独立路由。
  - 未注册的平台不列出；未验证能力不得标记支持。未知平台 404、已注册但未启用平台 422、平台不匹配 400。

  功能边界：
  - 输入为公开分享文本；提取 URL、展开短链、识别平台和作品 ID，再获取作品信息。
  - 返回媒体类型、完整的最终 CDN URL、必要下载请求头，以及可确认的过期信息。
  - 区分视频与图集；图集允许混合普通图片和实况照片，并保留顺序及每张实况的图片/短片配对关系。
  - 不确定过期时间时返回空值；保留 URL 查询参数。调用方负责实际下载、本地存储、相册操作和原生实况封装。
  - 服务端不承担媒体文件落盘、转码、批量采集或相册集成。

  响应契约：
  - 三个端点响应均包含服务端生成的 requestId；两个解析入口共用 platform、字符串 workId、workType、webUrl、可空 description、items、resolvedAt、expiresAt。
  - 媒体项包含从 1 开始的 index、type、imageSources、videoSources；不适用的列表为空数组，实况两类来源保留在同一项。
  - 每个候选独立包含 url、完整 headers 及可空 mimeType、fileName、width、height、durationMs、sizeBytes、expiresAt；不使用顶层下载头继承。
  - 字段名 camelCase，UTC 时间使用 ISO 8601；固定字段全部输出，未知值显式 null，数组/字典不得为 null。
  - 错误为 requestId 与 error 对象，error 包含 code、message、retryable、可空 retryAfterSeconds；框架绑定错误与异常也保持此形状。

  严格无 Cookie：
  - 不接收、生成、存储或发送 Cookie；不转发入站 Cookie，也不复用上游 Set-Cookie。
  - 短链及播放地址的每一跳重定向同样遵守无 Cookie 约束。
  - 不构造账号/游客身份、不维护身份池、不使用浏览器会话回退。
  - 常规 HTTP 请求头和本地签名计算只有在不依赖身份或会话构造时才可采用。
  - 匿名链路无法返回媒体数据时明确失败，不隐式降级为 Cookie 方案。

  平台与验证：
  - 已注册抖音与 Bilibili；前者支持四类媒体，后者仅支持普通视频的完整单段 MP4。其他平台分别验证后注册，不预注册或宣称已经支持。
  - 当前抖音四类样本及 Bilibili BV/AV/短链/分 P 的严格无 Cookie 解析及调用方下载已验证；公开可见性不保证任意作品、网络或未来协议均可匿名解析。
  - 验证按各平台实现范围执行；抖音覆盖四类媒体，Bilibili 覆盖 BV/AV/短链/所选 P 的完整音视频及调用方 CDN 下载，不将 DASH 轨道当作完整备用视频。

  开发约定：
  - HTTP 端点采用 Minimal API，以路由分组和路由扩展方法组织，解析逻辑通过依赖注入调用；不采用 MVC Controller。
  - OpenSpec 的说明、设计、任务和验收内容优先使用中文，保留工具规定的标题与关键字。
  - C# 使用文件范围命名空间；接口与实现默认位于同一命名空间，不为组织代码引入不必要分层。
  - 公开 API 保持精简，明确可空性和异步边界；优先采用 native AOT 友好的实现。
  - 复杂或非显而易见的协议处理需要说明意图；协议常量使用语义明确的命名。

rules:
  proposal:
    - 使用中文正文，保留模板要求的 Markdown 标题。
    - 明确变更范围、非目标和验证依据，不将待验证的无 Cookie 路线描述为已实现能力。
  specs:
    - 要求及场景正文使用中文，保留 Requirement、Scenario、SHALL/MUST 和 WHEN/THEN 等工具要求的格式与关键字。
    - 涉及网络请求或重定向时，明确每一跳不携带 Cookie、不得构造身份，以及匿名访问失败时的行为。
    - 涉及媒体结果时，覆盖图集顺序、混合图集、实况配对、最终 CDN 地址及必要下载请求头。
  design:
    - 说明 .NET 10 实现方式及相关部署影响，优先保持设计精简。
    - 区分本地签名计算与身份/会话构造；涉及签名或编码时说明字节一致性和固定输入的验证方法。
    - 需要平台实测时，区分已有证据与假设，并说明如何验证服务端解析和调用方下载的完整链路。
  tasks:
    - 使用中文，按依赖顺序列出可独立验证的任务。
    - 根据变更安排适当验证，保留可复现的结果；仅在实际项目和容器文件存在后列出相应构建或部署命令。
